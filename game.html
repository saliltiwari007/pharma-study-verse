<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play EduGame | Pharma Study Verse</title><meta name="description" content="Interactive pharmacy learning game."><link rel="stylesheet" href="assets/css/site.css"><style>.game-wrap{max-width:820px;margin:auto}.game-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}.game-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:8px;background:#e8eff0;border-radius:99px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;width:0;background:#16786f;transition:.25s}.question{font-size:1.35rem;font-weight:750;line-height:1.35;margin:25px 0}.answers{display:grid;gap:10px}.answer{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font:inherit;cursor:pointer}.answer:hover{border-color:#16786f}.answer.correct{border-color:#16786f;background:#eef8f5}.answer.wrong{border-color:#b44;background:#fff2f2}.feedback{margin-top:14px;padding:13px;border-radius:10px;background:#f5f8f8;min-height:22px}.game-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.result{text-align:center;padding:25px}.score{font-size:3rem;font-weight:800;color:#16786f}.hidden{display:none}.meta{font-size:.82rem;color:var(--muted)}@media(max-width:600px){.game-card{padding:20px}.question{font-size:1.15rem}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">P</span>Pharma Study Verse</a><nav class="navlinks"></nav><button class="menu" data-menu aria-label="Open navigation">☰</button></div></header><main class="page"><div class="container game-wrap"><div class="page-head"><div><span class="eyebrow">EduGame Zone</span><h1 id="game-title">Learning Game</h1><p id="game-desc">Answer, learn, repeat.</p></div><a class="btn btn-secondary" href="games.html">← All Games</a></div><section class="game-card" id="play"><div class="game-top"><strong id="counter">Question 1</strong><span class="meta" id="score-label">Score: 0</span></div><div class="progress"><i id="bar"></i></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="game-actions"><button class="btn btn-secondary" id="restart">Restart</button><button class="btn btn-primary" id="next" disabled>Next →</button></div></section><section class="game-card result hidden" id="result"><div class="eyebrow">Round complete</div><h2>Your learning score</h2><div class="score" id="final-score">0/0</div><p id="final-note"></p><div class="actions"><button class="btn btn-primary" id="play-again">Play Again</button><a class="btn btn-secondary" href="games.html">Choose another game</a></div></section></div></main><footer class="footer"><div class="container"><h3>Pharma Study Verse</h3><small>Practice for learning—not official academic marks.</small></div></footer><script src="assets/js/site.js"></script><script>(function(){const data={chemistry:{title:'Structure Sprint',desc:'Quickly identify core pharmaceutical chemistry concepts.',qs:[['Which functional group is characteristic of alcohols?',['Hydroxyl (–OH)','Carboxyl (–COOH)','Amino (–NH₂)','Nitro (–NO₂)'],0,'Alcohols contain a hydroxyl group.'],['What does pH below 7 generally indicate?',['Acidic','Neutral','Basic','Non-aqueous'],0,'On the usual aqueous pH scale, values below 7 are acidic.'],['Which bond joins amino acids in a peptide?',['Peptide bond','Ester bond','Glycosidic bond','Disulfide only'],0,'A peptide bond links the amino group of one amino acid to the carboxyl group of another.']]},pharmaceutics:{title:'Formulation Match',desc:'Match dosage-form and formulation concepts.',qs:[['Which excipient is commonly used as a tablet diluent?',['Lactose','Sodium chloride only','Ethanol','Hydrochloric acid'],0,'Lactose is a common tablet diluent/filler.'],['What is a suspension?',['Insoluble solid particles dispersed in a liquid','Gas dissolved in gas','Only a true solution','Two gases mixed'],0,'A suspension contains relatively large insoluble particles dispersed in a continuous phase.'],['Why are preservatives used in some aqueous formulations?',['To limit microbial growth','To increase tablet hardness only','To sterilize every product','To replace packaging'],0,'Preservatives can inhibit microbial growth; they do not replace validated sterilization when required.']]},pharmacology:{title:'Drug Class Match',desc:'Connect medicines with basic pharmacology concepts.',qs:[['Beta blockers primarily antagonize which receptors?',['Beta-adrenergic receptors','Muscarinic receptors','Histamine H1 only','Nicotinic receptors only'],0,'Beta blockers reduce beta-adrenergic receptor activation.'],['What is a drug agonist?',['A substance that activates a receptor to produce a response','A substance that always destroys a receptor','A formulation preservative','A tablet coating'],0,'An agonist binds to a receptor and activates it to produce a response.'],['What is pharmacokinetics broadly about?',['What the body does to a drug','What a drug does to a receptor only','Tablet compression only','Plant identification'],0,'Pharmacokinetics covers absorption, distribution, metabolism and excretion.']]},pharmacognosy:{title:'Natural Source Hunt',desc:'Recall natural sources and crude-drug concepts.',qs:[['Senna is classically associated with which source?',['Cassia/Senna species','Digitalis only','Clove only','Peppermint only'],0,'Senna drugs are obtained from Senna species.'],['Alkaloids are generally classified as what?',['Nitrogen-containing basic natural compounds','Sugars only','Proteins only','Lipids only'],0,'Many alkaloids are nitrogen-containing basic compounds of natural origin.'],['Clove is a well-known source of which constituent?',['Eugenol','Quinine','Atropine','Digoxin'],0,'Eugenol is a major constituent of clove oil.']]},analysis:{title:'Analysis Detective',desc:'Practice analytical principles and interpretation.',qs:[['What does an assay generally estimate?',['Amount or potency of an active ingredient','Tablet color only','Package weight only','Room temperature'],0,'An assay determines the amount/potency of the analyte, often the active ingredient.'],['What is the purpose of a calibration curve?',['Relate instrument response to known concentrations','Sterilize glassware','Change a compound into a tablet','Determine patient adherence'],0,'A calibration curve establishes the relationship between response and known analyte concentrations.'],['Which measure describes closeness to the true value?',['Accuracy','Precision only','Selectivity only','Robustness only'],0,'Accuracy describes closeness to the accepted/true value.']]},anatomy:{title:'Body Systems Rapid Fire',desc:'Fast recall across anatomy and physiology.',qs:[['Which organ is primarily responsible for pumping blood?',['Heart','Liver','Kidney','Pancreas'],0,'The heart pumps blood through the circulatory system.'],['Where does most gas exchange occur in the lungs?',['Alveoli','Trachea','Esophagus','Pleura'],0,'Gas exchange occurs across the alveolar-capillary membrane.'],['Which organ primarily filters blood to form urine?',['Kidney','Stomach','Spleen','Thyroid'],0,'The kidneys filter blood and form urine.']]},case:{title:'Case Challenge',desc:'Use foundational clinical reasoning in short scenarios.',qs:[['A patient has a documented severe allergy to a medicine. What is the safest first action when reviewing therapy?',['Flag the allergy and verify an alternative with the prescriber','Ignore it if the dose is small','Double the dose','Remove the allergy from the record'],0,'A documented severe allergy is a critical safety signal requiring verification and an appropriate alternative.'],['A prescription is unclear about strength. What should a pharmacist do?',['Clarify before dispensing','Guess from memory','Dispense any available strength','Change it without documentation'],0,'Ambiguous prescriptions should be clarified before dispensing.'],['A patient cannot understand how to use a dosage device. Best educational response?',['Demonstrate and use teach-back','Give no instructions','Only provide the brand name','Ask them to search online'],0,'Demonstration plus teach-back helps confirm correct understanding.']]},sort:{title:'Sort It Right',desc:'Put common learning processes in the correct order.',qs:[['Which sequence best describes the usual path of an oral drug through the body?',['Administration → absorption → distribution → metabolism → excretion','Excretion → administration → absorption → distribution → metabolism','Distribution → administration → excretion → absorption → metabolism','Metabolism → administration → distribution → absorption → excretion'],0,'ADME is commonly taught as absorption, distribution, metabolism and excretion after administration.'],['Which sequence best fits a basic analytical workflow?',['Sample preparation → measurement → calculation → interpretation','Interpretation → sampling → measurement → preparation','Calculation → interpretation → preparation → measurement','Measurement → disposal → sampling → interpretation'],0,'A simplified workflow starts with preparing the sample, measuring it, calculating results and interpreting them.']]},truefalse:{title:'True or False',desc:'Quick concept checks across pharmacy.',qs:[['Pharmacokinetics includes absorption, distribution, metabolism and excretion.',['True','False'],0,'This is the standard ADME framework.'],['An excipient is always the active therapeutic ingredient.',['True','False'],1,'Excipients are non-active formulation ingredients, although they can have important functional roles.'],['Precision describes the closeness of repeated measurements to each other.',['True','False'],0,'Precision concerns agreement among repeated measurements.']]}};const params=new URLSearchParams(location.search);const key=params.get('game')||'chemistry';const game=data[key]||data.chemistry;let i=0,score=0,answered=false;const $=id=>document.getElementById(id);$('game-title').textContent=game.title;$('game-desc').textContent=game.desc;function render(){answered=false;$('next').disabled=true;$('feedback').textContent='';$('counter').textContent=`Question ${i+1} of ${game.qs.length}`;$('score-label').textContent=`Score: ${score}`;$('bar').style.width=`${(i/game.qs.length)*100}%`;$('question').textContent=game.qs[i][0];$('answers').innerHTML=game.qs[i][1].map((a,n)=>`<button class="answer" data-n="${n}">${a}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.n)))}function answer(n){if(answered)return;answered=true;const q=game.qs[i],correct=q[2];document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('correct');if(j===n&&n!==correct)b.classList.add('wrong')});if(n===correct){score++;$('feedback').textContent='✓ Correct — '+q[3]}else $('feedback').textContent='✗ Not quite — '+q[3];$('score-label').textContent=`Score: ${score}`;$('next').disabled=false}function finish(){$('play').classList.add('hidden');$('result').classList.remove('hidden');$('final-score').textContent=`${score}/${game.qs.length}`;const pct=Math.round(score/game.qs.length*100);$('final-note').textContent=pct>=80?'Excellent recall. Try another subject or repeat to build speed.':pct>=60?'Good start. Review the explanations for missed questions and play again.':'Use the explanations to revise the concepts, then replay the round.'}$('next').addEventListener('click',()=>{if(i<game.qs.length-1){i++;render()}else finish()});$('restart').addEventListener('click',()=>{i=0;score=0;$('result').classList.add('hidden');$('play').classList.remove('hidden');render()});$('play-again').addEventListener('click',()=>{$('result').classList.add('hidden');$('play').classList.remove('hidden');i=0;score=0;render()});render()})();</script></body></html>
