name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          node --check worker.js
          node --check assets/js/site.js
          node --check assets/js/game-catcher-fix.js

      - name: JSON validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if any(part in {'.git','node_modules'} for part in path.parts): continue
              with path.open(encoding='utf-8') as f: json.load(f)
              print('JSON OK:', path)
          PY

      - name: HTML and local-link validation
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ('href','src'):
                      value=attrs.get(key)
                      if value: self.links.append(value.split('#',1)[0].split('?',1)[0])

          root=Path('.')
          errors=[]
          for path in root.rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in path.parts): continue
              text=path.read_text(encoding='utf-8')
              if '<!doctype html>' not in text.lower(): errors.append(f'{path}: missing HTML5 doctype')
              p=Parser(); p.feed(text)
              for link in p.links:
                  if not link or link.startswith(('http://','https://','mailto:','tel:','javascript:','data:','/api/')): continue
                  if not (path.parent/link).resolve().exists(): errors.append(f'{path}: missing local asset/link {link}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('HTML/link validation passed')
          PY

      - name: Security header sanity check
        run: |
          grep -q "X-Content-Type-Options: nosniff" _headers
          grep -q "Strict-Transport-Security:" _headers
          grep -q "Content-Security-Policy:" _headers

      - name: Game and worker invariant checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('game-catcher.html').read_text(encoding='utf-8')
          worker=Path('worker.js').read_text(encoding='utf-8')
          required_game=['20 target medicines','20 distractors','data-mode="beginner"','data-mode="medium"','data-mode="expert"','id="classSelect"','id="classProgress"']
          for marker in required_game:
              assert marker in game, f'Missing Drug Catcher marker: {marker}'
          for marker in ['POST','game_scores','completed','rawCorrect!==BOARD_TARGETS','expectedScore']:
              assert marker in worker, f'Missing leaderboard validation marker: {marker}'
          print('Game/worker invariants passed')
          PY

      - name: Architecture hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('assets/js/site.js').read_text(encoding='utf-8')
          assert text.count("assets/js/game-catcher-fix.js") == 1, 'Unexpected duplicate game-engine injection'
          assert Path('ARCHITECTURE.md').exists()
          assert Path('docs/DEVELOPMENT_STATUS.md').exists()
          print('Architecture hygiene passed')
          PY
